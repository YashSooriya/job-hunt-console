<!doctype html><html><body><h1>Software Engineer, Platform</h1><h2>Apply for this job</h2>
<label>First Name* <input name="first_name" required></label>
<label>Last Name* <input name="last_name" required></label>
<label>Email* <input name="email" type="email" required></label>
<label>Country <input name="country"></label>
<label>Phone <input name="phone"></label>
<label>Resume/CV* <input name="resume" type="file" required></label>
<label>Cover Letter <textarea name="cover_letter"></textarea></label>
<label>LinkedIn Profile <input name="linkedin"></label>
<label>Website <input name="website"></label>
<label>Are you open to working in person in our London office 2-3 times a week?* <select name="office" required><option value="">Select...</option><option>Yes</option><option>No</option></select></label>
<label>Are you currently bound by any agreements with a current or former employer that may restrict your ability to work for Scale AI or perform the duties of the position for which you are applying?* <select name="agreement" required><option value="">Select...</option><option>Yes</option><option>No</option></select></label>
<label>Are you legally authorized to work in the country where the job is located?* <select name="auth" required><option value="">Select...</option><option>Yes</option><option>No</option></select></label>
<label>Will you now or in the future require company sponsorship to retain or extend your work authorization in the country where the job is located?* <select name="sponsorship" required><option value="">Select...</option><option>Yes</option><option>No</option></select></label>
<button type="button" id="submit" onclick="window.__submitted=true">Submit application</button>
<script>window.__submitted=false;</script></body></html>
