<!doctype html><html><body><div class="stage" id="one"><h1>Custom Engineering Application</h1><label>First name* <input name="first_name" required></label><label>Email* <input name="email" required></label><button type="button" data-next="two">Continue</button></div>
<div class="stage" id="two" hidden><h2>Screening questions</h2><label>What are your salary expectations?* <input name="salary" required></label><label>Cover Letter <textarea name="cover_letter"></textarea></label><button type="button" data-next="review">Review application</button></div>
<div class="stage" id="review" hidden><h2>Review your application</h2><p>Please check your application before submitting.</p><button type="button" onclick="window.__submitted=true">Submit application</button></div>
<script>function go(id){document.querySelectorAll('.stage').forEach(x=>x.hidden=true);document.getElementById(id).hidden=false}document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>go(b.dataset.next));window.__submitted=false;</script></body></html>
